[package]
name = "rustytavern-plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Native plugin contracts and optional external process support."

[features]
default = []
process = ["dep:rustytavern-adapters", "dep:rustytavern-card", "dep:tokio", "dep:url"]

[dependencies]
rustytavern-core.workspace = true
rustytavern-conversation.workspace = true
rustytavern-store.workspace = true
async-trait.workspace = true
futures-util.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio-util.workspace = true
rustytavern-card = { workspace = true, optional = true }
rustytavern-adapters = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
url = { workspace = true, optional = true }

[dev-dependencies]
rustytavern-card.workspace = true
rustytavern-conversation.workspace = true
rustytavern-store = { workspace = true, features = ["sqlite"] }
clap.workspace = true
tokio.workspace = true

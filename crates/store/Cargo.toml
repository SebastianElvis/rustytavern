version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Atomic storage contracts with an optional SQLite adapter."

[features]
default = []
sqlite = ["dep:rusqlite", "rustytavern-core/sqlite"]

[dependencies]

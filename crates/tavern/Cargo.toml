[package]
name = "rustytavern"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The assembled RustyTavern product library and extension packages."

[dependencies]
rustytavern-core.workspace = true
rustytavern-card.workspace = true
rustytavern-conversation.workspace = true
rustytavern-plugin = { workspace = true, features = ["process"] }
rustytavern-adapters.workspace = true
rustytavern-runtime.workspace = true
rustytavern-store = { workspace = true, features = ["sqlite"] }
async-trait.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true

[dev-dependencies]
async-trait.workspace = true
clap.workspace = true
crc32fast.workspace = true
futures-util.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[[example]]
name = "feature_services"
path = "examples/plugins/feature_services.rs"

[[example]]
name = "conversation"
path = "examples/library/conversation.rs"

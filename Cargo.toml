[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "Apache-2.0"
repository = "https://github.com/SebastianElvis/rustytavern"

[workspace.dependencies]
rustytavern = { path = "crates/tavern" }
rustytavern-core = { path = "crates/core" }
rustytavern-session = { path = "crates/session" }
rustytavern-runtime = { path = "crates/runtime" }
async-trait = "0.1.89"
base64 = "0.23.1"
clap = { version = "4.6", features = ["derive"] }
crc32fast = "1.4"
futures-util = "0.3"
rig-core = { version = "0.46.0", default-features = false }
rig-agent = { version = "0.46.0", default-features = false }
rig-reqwest = "0.46.0"
rig-rmcp = "0.46.0"
rig-cassette = { version = "0.46.0", default-features = false, features = ["http"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls"] }
rusqlite = { version = "0.41", features = ["bundled"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "process", "io-util", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"
toml_edit = { version = "0.25", features = ["serde"] }
rmcp = { version = "3.9", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "scrolling-regions", "unstable-rendered-line-info"] }
crossterm = { version = "0.29", features = ["event-stream"] }
ratatui-textarea = "0.9.4"
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
pulldown-cmark = { version = "0.13", default-features = false }
unicode-width = "0.2"
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
